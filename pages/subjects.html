<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Resources — SBTE 2.0</title>
<meta name="description" content="Notes, PYQ and practical resources for this subject on SBTE 2.0." />
<link rel="icon" type="image/svg+xml" href="/assets/icons/favicon.svg" />
<meta name="theme-color" content="#0a0e13" />
<link rel="apple-touch-icon" href="/assets/logo.jpg" />
<link rel="manifest" href="/manifest.json" />
<meta property="og:type" content="website" />
<meta property="og:site_name" content="SBTE 2.0" />
<meta property="og:title" content="Resources — SBTE 2.0" />
<meta property="og:description" content="Notes, PYQ and practical resources for this subject on SBTE 2.0." />
<meta property="og:image" content="/assets/logo.jpg" />
<meta name="twitter:card" content="summary" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/css/style.css" />
<link rel="stylesheet" href="/css/responsive.css" />
<link rel="stylesheet" href="/css/animations.css" />
</head>
<body>
<a class="skip-link" href="#main-content">Skip to content</a>

<canvas id="bg-canvas"></canvas>
<div class="bg-grid"></div>

<header class="site-header" id="site-header"></header>

<nav class="crumb-strip" aria-label="Breadcrumb">
  <div class="container">
    <div class="crumb" id="crumb"></div>
  </div>
</nav>

<main id="main-content">
  <div class="container">
    <div class="section-head" id="subj-head">
      <span class="eyebrow">Step 4 of 4</span>
      <h2 id="subj-title">Loading&hellip;</h2>
      <p id="subj-sub"></p>
    </div>
    <div class="resource-grid" id="resource-grid" aria-live="polite"></div>
  </div>
</main>

<footer class="site-footer" id="site-footer"></footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/navigation.js"></script>
<script src="/js/app.js"></script>
<script src="/js/three-background.js"></script>
<script src="/js/animations.js"></script>
<script>
  async function initSubjectsPage() {
    const grid = document.getElementById("resource-grid");
    const crumbEl = document.getElementById("crumb");

    let curriculum;
    try {
      curriculum = await Api.getCurriculum();
    } catch (e) {
      renderEmptyState(grid, { title: "Couldn't load the curriculum", message: e.message, isError: true, iconName: "alert" });
      return;
    }

    const branch = Nav.findBranch(curriculum, Nav.param("branch"));
    const semester = Nav.findSemester(branch, Nav.param("sem"));
    const subject = Nav.findSubject(semester, Nav.param("subject"));
    const electiveId = Nav.param("elective");

    // A "special" subject (an elective group) has no PDFs of its own — it
    // needs a chosen option first. Send the person to pick one instead of
    // showing a broken resource chooser.
    if (branch && semester && subject && subject.type === "special" && !electiveId) {
      Nav.go("/pages/special-subject.html", { branch: branch.id, sem: semester.number, subject: subject.id });
      return;
    }

    const elective = subject && subject.type === "special" ? Nav.findElective(subject, electiveId) : null;
    const invalid = !branch || !semester || !subject || (subject.type === "special" && !elective);

    if (invalid) {
      document.getElementById("subj-head").style.display = "none";
      renderEmptyState(grid, {
        title: "Subject not found",
        message: "That link looks wrong or out of date. Start again from the semester page.",
        isError: true, iconName: "alert",
      });
      return;
    }

    const displayName = elective ? elective.name : subject.name;
    document.title = `${displayName} \u2014 SBTE 2.0`;
    document.getElementById("subj-title").textContent = displayName;
    document.getElementById("subj-sub").textContent = `${branch.name} \u2014 Semester ${Nav.romanSemester(semester.number)}${elective ? ` \u2014 ${subject.name}` : ""}`;
    Nav.renderCrumbs(crumbEl, { branch, semester, subject, elective });

    const RESOURCE_TYPES = [
      { id: "notes", label: "Notes", desc: "Unit-wise study notes for this subject.", icon: "notes" },
      { id: "pyq", label: "PYQ", desc: "Previous year question papers.", icon: "pyq" },
      { id: "practical", label: "Practical", desc: "Lab and practical experiment files.", icon: "practical" },
    ];

    grid.innerHTML = RESOURCE_TYPES.map((rt) => `
      <a class="card resource-card stampable" style="--accent:${branch.accent}"
         href="${Nav.buildUrl('/pages/resources.html', { branch: branch.id, sem: semester.number, subject: subject.id, elective: elective ? elective.id : undefined, type: rt.id })}">
        <div class="card__icon">${icon(rt.icon)}</div>
        <h3>${rt.label}</h3>
        <p>${rt.desc}</p>
      </a>`).join("");

    Animate.revealCards("#resource-grid .resource-card");
  }
  document.addEventListener("DOMContentLoaded", initSubjectsPage);
</script>
</body>
</html>
